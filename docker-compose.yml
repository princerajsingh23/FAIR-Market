version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: fair_market_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fairmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fairmarket_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fairmarket_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairmarket -d fairmarket_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fair_market_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fairmarket}:${POSTGRES_PASSWORD:-fairmarket_dev_pass}@db:5432/${POSTGRES_DB:-fairmarket_db}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fair_market_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
